name: Standalone Package (public inputs)

# Verification route for the launch and measurement infrastructure.
# Inputs are public source and synthetic only: OpenBIOS is built from the pinned public
# Nugget revision, the disc comes from scripts/demo/synthetic-disc.ps1. No ROM, BIOS or
# commercial data is used, cached or uploaded. A green run is NOT evidence that any
# title boots or reaches a title screen.
#
# This workflow is separate from ci.yml and is not a required check of the CI Gate.

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  standalone-package-public:
    name: Standalone package (public inputs)
    # The pinned OpenBIOS toolchain (mipsel-none-elf GCC 16.2.0, see scripts/openbios/build.sh)
    # is a Windows build, so the native build runs on a Windows runner.
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      OPENBIOS_PIN: c950e18a168944ec2d4e6d3c408fc224317483a7
      TOOLCHAIN_URL: https://static.grumpycoder.net/pixel/mips/g++-mipsel-none-elf-16.2.0.zip
      TOOLCHAIN_SHA256: cf84960f5624829d44b866c5f194094c21c63b30f7cbb8cf3030f1abebd52b75
      SYNTHETIC_DISC_SHA256: ce3981541466bf84f1589334b2e306b5e253ef7352b30b6e4bac101d09d41606
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Self-tests for the ROM-absence gate. They use seeded random data in a temp directory, never a ROM.
      - name: Self-test ROM-absence gate (no ROM)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test_standalone_package_verify.py

      # Everything below lives outside the checkout. Only $WORK/stage is uploaded.
      # (The runner context is not available in a job-level env block, so WORK is set here.)
      - name: Set work directory
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "WORK=$RUNNER_TEMP_DIR/psx" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Record tool versions
        shell: bash
        run: |
          set -euo pipefail
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          gcc --version | head -1
          gcc -dumpfullversion -dumpversion
          python --version
          dotnet --version
          pwsh --version

      - name: Fetch pinned OpenBIOS source (Nugget)
        shell: bash
        run: |
          set -euo pipefail
          W="$(cygpath -u "$WORK")"
          src="$W/nugget"
          rm -rf "$src"
          mkdir -p "$src"
          git -c core.autocrlf=false -C "$src" init -q
          git -C "$src" remote add origin https://github.com/pcsx-redux/nugget.git
          git -C "$src" -c core.autocrlf=false fetch -q --depth 1 origin "$OPENBIOS_PIN"
          git -C "$src" -c core.autocrlf=false -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$OPENBIOS_PIN"
          git -C "$src" -c core.autocrlf=false submodule update --init --recursive --depth 1
          echo "Nugget checked out at $(git -C "$src" rev-parse HEAD)"

      - name: Fetch and verify pinned toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = Join-Path $env:WORK 'toolchain'
          Remove-Item -Recurse -Force $dl -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dl | Out-Null
          $zip = Join-Path $dl 'toolchain.zip'
          Invoke-WebRequest -Uri $env:TOOLCHAIN_URL -OutFile $zip -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TOOLCHAIN_SHA256) { throw "toolchain SHA-256 mismatch: $actual (expected $env:TOOLCHAIN_SHA256); refusing to use it" }
          Write-Host "toolchain archive SHA-256 verified: $actual"
          $extract = Join-Path $dl 'gcc'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $gcc = Get-ChildItem -Path $extract -Recurse -Filter 'mipsel-none-elf-gcc.exe' | Select-Object -First 1
          if (-not $gcc) { throw 'mipsel-none-elf-gcc.exe not found in the verified archive' }
          # scripts/openbios/build.sh prepends this bin directory to PATH. The archive's own coreutils would
          # shadow the runner's Git Bash tools: its mkdir created the output directory under a different path
          # mapping, so build.sh's cp then failed. They are renamed in this extracted copy only; the verified
          # zip is unchanged, and gcc, as, ld, objcopy and make are kept.
          foreach ($shadow in 'cat.exe', 'cp.exe', 'echo.exe', 'mkdir.exe', 'rm.exe', 'touch.exe', 'which.exe') {
            $p = Join-Path $gcc.Directory.FullName $shadow
            if (Test-Path -LiteralPath $p) { Rename-Item -LiteralPath $p -NewName "$shadow.shadowed" }
          }
          "TOOLCHAIN_BIN_WIN=$($gcc.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build OpenBIOS from the pinned revision
        shell: bash
        run: |
          set -euo pipefail
          W="$(cygpath -u "$WORK")"
          export OPENBIOS_TOOLCHAIN_BIN="$(cygpath -u "$TOOLCHAIN_BIN_WIN")"
          export OPENBIOS_BUILD_JOBS=2
          rm -rf "$W/openbios-out"
          # build.sh does not print or record the built ROM's digest (the protection is at the source, not a log
          # filter). Its output directory lives under $WORK and is never uploaded.
          bash scripts/openbios/build.sh --builder native "$W/nugget" "$W/openbios-out"

      - name: Generate synthetic disc (public generator)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $disc = Join-Path $env:WORK 'disc'
          Remove-Item -Recurse -Force $disc -ErrorAction SilentlyContinue
          # The script throws on a hash mismatch; with $ErrorActionPreference = 'Stop' that ends this step.
          # ($LASTEXITCODE is not used: it is $null here because no native command has run.)
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/demo/synthetic-disc.ps1') -WorkDir $disc -OpenBiosCompatible
          $file = Join-Path $disc 'synthetic-disc-openbios.bin'
          $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:SYNTHETIC_DISC_SHA256) { throw "synthetic disc SHA-256 mismatch: $sha" }
          "DISC_PATH=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "synthetic disc SHA-256 $sha"

      - name: Prepare AOT inputs and package (--bios openbios)
        shell: bash
        run: |
          set -euo pipefail
          W="$(cygpath -u "$WORK")"
          ROM="$W/openbios-out/openbios.bin"
          ELF="$W/openbios-out/openbios.elf"
          AOT="$W/aot"
          PKG="$W/pkg/psxrecomp-public-openbios"
          DISC="$(cygpath -u "$DISC_PATH")"
          rm -rf "$AOT" "$W/pkg"
          mkdir -p "$AOT"
          # prepare-aot's output is not echoed: a traceback can name local paths. Only a status is public.
          # The ROM-derived code-byte count goes to a file under $WORK (never uploaded, never printed).
          code_file="$W/prepare-aot-code-bytes.txt"
          rm -f "$code_file"
          if ! python scripts/openbios/prepare-aot.py "$ELF" "$AOT" --code-bytes-out "$code_file" >/dev/null 2>&1; then
            echo "prepare-aot: FAILED"
            exit 1
          fi
          echo "prepare-aot: ok"
          code_bytes="$(cat "$code_file")"
          [[ "$code_bytes" =~ ^[0-9]+$ ]] || { echo "prepare-aot: code-byte input unavailable"; exit 1; }
          # The package command's output can name local paths (usage and failure messages), so it goes to the work directory and
          # only fixed status lines are printed. A failure prints no detail.
          if ! dotnet run --project src/PSXRecomp.Cli/PSXRecomp.Cli.csproj --configuration Release -- \
            package "$DISC" --bios openbios --bios-rom "$ROM" --aot-dir "$AOT" --output "$PKG" \
            --code-bytes "$code_bytes" --run-timeout-seconds 60 --build-timeout-seconds 900 \
            > "$W/package-output.txt" 2>&1; then
            echo "package: FAILED; details are not published."
            exit 1
          fi
          echo "package: ok"
          # Relative names only: the runner's absolute paths are not printed.
          (cd "$PKG" && find . -type f | sort)

      - name: Run packaged runtime host (--frame-out, --diagnostics)
        shell: bash
        run: |
          set -euo pipefail
          W="$(cygpath -u "$WORK")"
          PKG="$W/pkg/psxrecomp-public-openbios"
          RUN="$W/run"
          rm -rf "$RUN"
          mkdir -p "$RUN"
          host="$PKG/runtime/PSXRecomp.RuntimeHost.exe"
          test -f "$host"
          # The firmware distribution needs the OpenBIOS image named at run time. It is the ROM built
          # above, read from the runner's work directory; it is never copied into the package, the run
          # folder or the upload set. The .NET host reads the variable directly, so it gets a Windows path.
          # The variable is set for this command only.
          ROM="$W/openbios-out/openbios.bin"
          test -s "$ROM"
          ROM_WIN="$(cygpath -w "$ROM")"
          set +e
          (cd "$RUN" && PSXRECOMP_BIOS_ROM="$ROM_WIN" "$host" --diagnostics "$RUN/diagnostics.json" --frame-out "$RUN/frame.png" "$PKG/runtime/runtime-host.json" > "$W/host-stdout.txt" 2> "$W/host-stderr.txt")
          rc=$?
          set -e
          echo "runtime host exit code: $rc"
          echo "HOST_EXIT_CODE=$rc" >> "$GITHUB_ENV"
          # The host's stdout and stderr are never printed raw (they can carry paths, digests and ROM-run detail). Each stream goes
          # through the public-lines filter: only the firmware-run JSON line and plain text are printed, and the rest is counted.
          python scripts/ci/standalone-package-verify.py public-lines --file "$W/host-stdout.txt" --label stdout
          python scripts/ci/standalone-package-verify.py public-lines --file "$W/host-stderr.txt" --label stderr
          # Names only: file sizes of the host's output are not printed (they are run-derived numbers).
          ls "$RUN"
          # Fail closed: the job is green only when the host exits 0 and produced a non-empty frame.png.
          # A failing step stops the later steps, so nothing is staged or uploaded.
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: runtime host exited $rc (expected 0); no frame is accepted"
            exit 1
          fi
          if [ ! -s "$RUN/frame.png" ]; then
            echo "FAIL: run/frame.png is missing or empty"
            exit 1
          fi
          echo "frame.png: present and non-empty"

      # Runs only after a failed step. It keeps the failing host's diagnostics.json, but only when the
      # public-safety scan passes (ROM windows, absolute paths, digests, JSON). It never changes the job
      # result: the host step has already failed, so the job stays FAILURE. Counts only are printed.
      - name: Scan failure diagnostics (public-safety gate)
        id: diag
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          W="$(cygpath -u "$WORK")"
          RUN="$W/run"
          DIAG="$W/diag-stage"
          rm -rf "$DIAG"
          mkdir -p "$DIAG"
          if [ ! -f "$RUN/diagnostics.json" ]; then
            echo "no diagnostics.json was written by the host; nothing to keep"
            exit 0
          fi
          rc=0
          python scripts/ci/standalone-package-verify.py diag-scan \
            --rom "$W/openbios-out/openbios.bin" --file "$RUN/diagnostics.json" \
            --allow-digest "$SYNTHETIC_DISC_SHA256" --allow-digest "$OPENBIOS_PIN" \
            --forbid-prefix "$RUNNER_TEMP" --forbid-prefix "$(cygpath -u "$RUNNER_TEMP")" \
            --forbid-prefix "$GITHUB_WORKSPACE" --forbid-prefix "$(cygpath -u "$GITHUB_WORKSPACE")" \
            || rc=$?
          if [ "$rc" -eq 0 ] && cp "$RUN/diagnostics.json" "$DIAG/diagnostics.json"; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            echo "diagnostics.json scan passed; the file stays in the work directory (no failure artifact is uploaded)"
          else
            echo "diagnostics.json NOT staged (scan rc=$rc); see the counts above"
          fi
          exit 0

      # No failure-diagnostics artifact is uploaded. diagnostics.json is the Runtime host's private stop diagnostic: it carries
      # ROM-run counts and the final register file, which must not be published. The scan above still fails closed, and the
      # file stays in the work directory.

      # Success path: the same public-safety scan as the failure path, and it runs before anything is staged.
      # The host exited 0, so diagnostics.json must exist, and the run folder may hold only the known files.
      # Any violation fails this step (set -e): the stage step does not run, so nothing is uploaded.
      - name: Scan success diagnostics (public-safety gate, fail closed)
        shell: bash
        run: |
          set -euo pipefail
          W="$(cygpath -u "$WORK")"
          RUN="$W/run"
          if [ ! -f "$RUN/diagnostics.json" ]; then
            echo "FAIL: the host wrote no diagnostics.json on success; nothing may be uploaded"
            exit 1
          fi
          unexpected="$(find "$RUN" -mindepth 1 -maxdepth 1 ! -name diagnostics.json ! -name frame.png | wc -l)"
          if [ "$unexpected" -ne 0 ]; then
            echo "FAIL: $unexpected unexpected entries in the run folder (counts only); nothing may be uploaded"
            exit 1
          fi
          python scripts/ci/standalone-package-verify.py diag-scan \
            --rom "$W/openbios-out/openbios.bin" --file "$RUN/diagnostics.json" \
            --allow-digest "$SYNTHETIC_DISC_SHA256" --allow-digest "$OPENBIOS_PIN" \
            --forbid-prefix "$RUNNER_TEMP" --forbid-prefix "$(cygpath -u "$RUNNER_TEMP")" \
            --forbid-prefix "$GITHUB_WORKSPACE" --forbid-prefix "$(cygpath -u "$GITHUB_WORKSPACE")"
          echo "success-path diagnostics scan passed; diagnostics.json is not uploaded, and only the allowlisted package is staged (frame.png stays in the work directory)"

      - name: Stage upload set and verify ROM absence
        shell: bash
        run: |
          set -euo pipefail
          W="$(cygpath -u "$WORK")"
          ROM="$W/openbios-out/openbios.bin"
          RUN="$W/run"
          STAGE="$W/stage"
          # The public upload set is an explicit allowlist in standalone-package-verify.py (PUBLIC_ALLOWED_FILES and its patterns).
          # A file that matches no rule fails this step, and no stage is created. frame.png is not published (see the verifier):
          # it stays in the work directory. A fixed THIRD-PARTY-NOTICES.txt is written into the package.
          # Executables are excluded by policy (the .NET apphost is under Microsoft .NET Library terms, not published here). The
          # internal package and the Standalone run are unchanged. Nothing is deleted from $W: internal files stay there.
          python scripts/ci/standalone-package-verify.py stage \
            --package-src "$W/pkg/psxrecomp-public-openbios" --run-dir "$RUN" --stage "$STAGE"
          python scripts/ci/standalone-package-verify.py verify --rom "$ROM" --staging "$STAGE"

      # The manifest records no built-ROM size or digest, and no size or digest of any ROM-derived file (see
      # standalone-package-verify.py manifest). A published digest or size of the ROM would let anyone test a candidate ROM.
      - name: Write provenance manifest and re-verify
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
          GH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          W="$(cygpath -u "$WORK")"
          ROM="$W/openbios-out/openbios.bin"
          STAGE="$W/stage"
          DISC="$(cygpath -u "$DISC_PATH")"
          TC_ZIP="$W/toolchain/toolchain.zip"
          gcc_version="$(gcc -dumpfullversion -dumpversion)"
          gcc_line="$(gcc --version | head -1)"
          tc_gcc_version="$("$(cygpath -u "$TOOLCHAIN_BIN_WIN")/mipsel-none-elf-gcc.exe" -dumpfullversion -dumpversion)"
          python scripts/ci/standalone-package-verify.py manifest \
            --rom "$ROM" --staging "$STAGE" --disc "$DISC" --toolchain-zip "$TC_ZIP" \
            --toolchain-pin "$TOOLCHAIN_SHA256" --toolchain-url "$TOOLCHAIN_URL" \
            --toolchain-gcc-version "$tc_gcc_version" --openbios-revision "$OPENBIOS_PIN" \
            --checkout-sha "$GH_SHA" --pr-head-sha "$GH_PR_HEAD_SHA" --event-name "$GH_EVENT" \
            --repository "$GH_REPOSITORY" --run-id "$GH_RUN_ID" --run-attempt "$GH_RUN_ATTEMPT" \
            --runner-image "${ImageOS:-unknown} ${ImageVersion:-unknown}" \
            --compiler-name gcc --compiler-version "$gcc_version" --compiler-line "$gcc_line" \
            --host-exit-code "$HOST_EXIT_CODE"
          {
            echo "## Standalone package (public inputs) provenance"
            echo ""
            echo '```json'
            cat "$STAGE/provenance-manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified package (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: standalone-package-public
          path: ${{ env.WORK }}/stage
          retention-days: 1
          if-no-files-found: error

      - name: Remove built ROM from the runner
        if: always()
        shell: bash
        run: |
          W="$(cygpath -u "$WORK")"
          rm -f "$W/openbios-out/openbios.bin" || true
