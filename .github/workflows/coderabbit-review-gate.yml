name: CodeRabbit Review Gate

# Trusted workflow: pull_request_target loads this file from the base branch,
# never from PR code. It only reads Git objects and GitHub review metadata.
"on":
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: coderabbit-review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: CodeRabbit Review Gate
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'check_run' && github.event.check_run.name != 'CodeRabbit Review Gate' && github.event.check_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted gate implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PR and collect review evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target|pull_request_review) number=$(jq -r '.pull_request.number' "$EVENT_PATH") ;;
            issue_comment) number=$(jq -r '.issue.number' "$EVENT_PATH") ;;
            check_run) number=$(jq -r '.check_run.pull_requests[0].number' "$EVENT_PATH") ;;
          esac
          [ -n "$number" ] || { echo 'No PR associated with event.' >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" > "$RUNNER_TEMP/pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/$number/reviews" --paginate --jq '.[]' > "$RUNNER_TEMP/reviews.ndjson"
          gh api "repos/${GITHUB_REPOSITORY}/issues/$number/comments" --paginate --jq '.[]' > "$RUNNER_TEMP/comments.ndjson"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Fetch immutable PR objects
        env:
          PR_NUMBER: ${{ steps.evidence.outputs.number }}
        run: git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"

      - name: Fetch review threads and current CI checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.evidence.outputs.number }}
          PR_HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
        run: |
          set -euo pipefail
          page_file="$RUNNER_TEMP/review-thread-pages.ndjson"
          : > "$page_file"
          cursor=''
          while :; do
            if [ -n "$cursor" ]; then
              response=$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!,$after:String!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$after){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}' \
                -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" \
                -F number="$PR_NUMBER" -F after="$cursor")
            else
              response=$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}' \
                -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" \
                -F number="$PR_NUMBER")
            fi
            if ! printf '%s' "$response" | jq -e '
              (.data.repository.pullRequest.reviewThreads.nodes | type == "array") and
              ([.data.repository.pullRequest.reviewThreads.nodes[]? |
                type == "object" and (.isResolved | type == "boolean")] | all) and
              (.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type == "boolean") and
              ((.data.repository.pullRequest.reviewThreads.pageInfo.endCursor == null) or
               (.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | type == "string")) and
              ((.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false) or
               (.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | length > 0))
            ' >/dev/null; then
              echo 'Malformed review-thread pagination response; blocking.' >&2
              exit 1
            fi
            jq -c '.data.repository.pullRequest.reviewThreads.nodes' <<<"$response" >> "$page_file"
            has_next=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$response")
            [ "$has_next" = true ] || break
            cursor=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor' <<<"$response")
            [ -n "$cursor" ] && [ "$cursor" != null ] || {
              echo 'Missing review-thread pagination cursor; blocking.' >&2
              exit 1
            }
          done
          jq -s 'add' "$page_file" > "$RUNNER_TEMP/threads.json"
          checks_pages=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/$PR_HEAD_SHA/check-runs")
          if ! printf '%s' "$checks_pages" | jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "object" and (.check_runs | type == "array"))
          ' >/dev/null; then
            echo 'Malformed or incomplete check-runs response; blocking.' >&2
            exit 1
          fi
          jq '[.[].check_runs[] |
            {name,
             status: ((.status // "") | ascii_upcase),
             conclusion: ((.conclusion // "") | ascii_upcase)}
          ]' <<<"$checks_pages" > "$RUNNER_TEMP/checks.json"

      - name: Evaluate CodeRabbit Review Gate
        run: |
          set -euo pipefail
          python3 scripts/ci/coderabbit-review-gate.py \
            --repo-dir "$GITHUB_WORKSPACE" \
            --base-sha "${{ steps.evidence.outputs.base_sha }}" \
            --head-sha "${{ steps.evidence.outputs.head_sha }}" \
            --reviews "$RUNNER_TEMP/reviews.ndjson" \
            --comments "$RUNNER_TEMP/comments.ndjson" \
            --threads "$RUNNER_TEMP/threads.json" \
            --checks "$RUNNER_TEMP/checks.json" \
            --output "$RUNNER_TEMP/coderabbit-gate.json"
