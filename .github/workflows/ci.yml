name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify documentation-only change
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          docs_only=false
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff --name-only "$base" "$head")
            if (( ${#changed_files[@]} > 0 )); then
              docs_only=true
              for path in "${changed_files[@]}"; do
                case "$path" in
                  docs/*|README*.md|CONTRIBUTING.md|.github/ISSUE_TEMPLATE/*.md)
                    ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done
            fi
          fi

          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Documentation-only change: %s\n' "$docs_only"
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]:-<unavailable>}"

  artifact-policy:
    name: Artifact Contamination Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check artifact policy
        shell: pwsh
        run: ./scripts/ci/check-artifact-policy.ps1

  native:
    name: Native Core Build and Test (Linux)
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Documentation-only fast path
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; native build/tests are not required."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Install Ninja
        if: needs.changes.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The Rust substrate is linked into PSXRecomp.Native, so `cargo build`
      # runs as part of the CMake build below on every platform (ADR-023). The
      # crate's unit tests are platform-independent, so they run once, here,
      # in a job the CI Gate already requires.
      - name: Rust unit tests
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: src/PSXRecomp.Native/rust
        run: cargo test --verbose

      - name: Configure
        if: needs.changes.outputs.docs_only != 'true'
        run: cmake -S src/PSXRecomp.Native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: cmake --build build/native --parallel

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: ctest --test-dir build/native --output-on-failure

      - name: Upload native library
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-native-linux-x64
          path: build/native/libPSXRecomp.Native.so
          if-no-files-found: error

  dotnet:
    name: .NET Build and Test (Linux)
    needs: [changes, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Documentation-only fast path
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; .NET build/tests are not required."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup .NET
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet restore src/PSXRecompStudio.slnx

      - name: Check NuGet vulnerabilities
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          report=$(dotnet list src/PSXRecompStudio.slnx package --vulnerable --include-transitive 2>&1 || true)
          echo "$report"

          if grep -Eiq '(^|[^[:alpha:]])(High|Critical)([^[:alpha:]]|$)|高 重大度|重大度.*高|critical severity|high severity' <<< "$report"; then
            echo "High or Critical NuGet vulnerabilities detected. CI cannot proceed."
            exit 1
          fi

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet build src/PSXRecompStudio.slnx --configuration Release --no-restore

      - name: Download native library
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: psxrecomp-native-linux-x64
          path: native

      - name: Install native library for .NET tests
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          test -f native/libPSXRecomp.Native.so
          cp native/libPSXRecomp.Native.so src/PSXRecomp.Tests/bin/Release/net10.0/
          ls -l src/PSXRecomp.Tests/bin/Release/net10.0/libPSXRecomp.Native.so

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        env:
          RECOMPILER_ARTIFACT_ROOT: ${{ runner.temp }}/recompiler-differential-artifacts
        run: |
          dotnet test src/PSXRecomp.Tests/PSXRecomp.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Upload differential harness failure artifacts
        if: needs.changes.outputs.docs_only != 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: recompiler-differential-artifacts
          path: ${{ runner.temp }}/recompiler-differential-artifacts
          if-no-files-found: ignore

  gui-tests:
    name: GUI Headless Tests (Linux)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Restore
        run: dotnet restore src/PSXRecompStudio.Tests/PSXRecompStudio.Tests.csproj

      - name: Build GUI test project
        run: dotnet build src/PSXRecompStudio.Tests/PSXRecompStudio.Tests.csproj --configuration Release --no-restore

      - name: Run headless GUI tests (no display server)
        run: dotnet test src/PSXRecompStudio.Tests/PSXRecompStudio.Tests.csproj --configuration Release --no-build --verbosity normal

  ci:
    name: CI Gate
    if: always()
    needs: [changes, artifact-policy, native, dotnet, gui-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require appropriate checks to pass
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change classification did not succeed."
            exit 1
          fi

          if [[ "${{ needs.artifact-policy.result }}" != "success" || "${{ needs.native.result }}" != "success" || "${{ needs.dotnet.result }}" != "success" ]]; then
            echo "Required CI jobs did not all succeed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.docs_only }}" == "true" ]]; then
            echo "Documentation-only change: heavyweight build/test jobs were intentionally skipped."
            exit 0
          fi

          if [[ "${{ needs.gui-tests.result }}" != "success" ]]; then
            echo "GUI tests did not succeed."
            exit 1
          fi

          echo "All required CI jobs passed."