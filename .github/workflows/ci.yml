name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Native Core Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S src/PSXRecomp.Native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native --parallel

      - name: Test
        run: ctest --test-dir build/native --output-on-failure

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-native-linux-x64
          path: build/native/libPSXRecomp.Native.so
          if-no-files-found: error

  dotnet:
    name: .NET Build and Test
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/PSXRecompStudio.slnx

      - name: Check NuGet vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          report=$(dotnet list src/PSXRecompStudio.slnx package --vulnerable --include-transitive 2>&1 || true)
          echo "$report"

          if grep -Eiq '(^|[^[:alpha:]])(High|Critical)([^[:alpha:]]|$)|高 重大度|重大度.*高|critical severity|high severity' <<< "$report"; then
            echo "High or Critical NuGet vulnerabilities detected. CI cannot proceed."
            exit 1
          fi

      - name: Build
        run: dotnet build src/PSXRecompStudio.slnx --configuration Release --no-restore

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: psxrecomp-native-linux-x64
          path: native

      - name: Install native library for .NET tests
        run: |
          test -f native/libPSXRecomp.Native.so
          cp native/libPSXRecomp.Native.so src/PSXRecomp.Tests/bin/Release/net10.0/
          ls -l src/PSXRecomp.Tests/bin/Release/net10.0/libPSXRecomp.Native.so

      - name: Test
        run: |
          dotnet test src/PSXRecomp.Tests/PSXRecomp.Tests.csproj --configuration Release --no-build --verbosity normal
          dotnet test src/PSXRecomp.Analyzer.Tests/PSXRecomp.Analyzer.Tests.csproj --configuration Release --no-build --verbosity normal

  ci:
    name: CI Gate
    if: always()
    needs: [dotnet, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        run: |
          if [[ "${{ needs.dotnet.result }}" != "success" || "${{ needs.native.result }}" != "success" ]]; then
            echo "Required CI jobs did not all succeed."
            exit 1
          fi
          echo "All required CI jobs passed."
