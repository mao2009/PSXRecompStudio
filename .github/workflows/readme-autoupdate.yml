name: README Auto-Update

# PR-triggered README updater (Issue #180, Issue #244). Two isolated jobs:
#
#   1. update-readme ("model" job, contents: read, NO GITHUB_TOKEN):
#      runs OpenCode pinned to opencode/big-pickle with assets extracted from
#      origin/main and emits ONLY a candidate README.md artifact. OpenCode can
#      never publish anything and has no repository credentials.
#   2. notify-readme ("notify" job, contents: read + pull-requests: write):
#      clean workspace, fresh origin/main extraction, single-file artifact,
#      mechanical validation, then compares the candidate README to the PR
#      head README. If identical it emits no comment (no noise); if different
#      it posts ONE idempotent, advisory PR comment referencing the candidate
#      artifact and the apply/decline instructions.
#
# The bot NEVER pushes a commit to the PR head branch (Issue #244). A
# github-actions[bot]-authored PR HEAD leaves required CI in action_required
# with 0 jobs (GitHub recursion/protection), permanently blocking the merge
# gate. README updates are instead surfaced as a comment + artifact reference
# so the author folds them into a normal (human-authored, CI-capable) commit.
#
# This workflow is ADVISORY maintenance automation and must never affect
# whether a pull request is mergeable (Issue #268). GitHub turns a PR into
# mergeable_state=unstable ("Mergeable with non-passing commit status") when
# ANY check run on the head SHA fails - including check runs that are not in
# the branch ruleset's required list, as this workflow's are not. Every step
# below therefore carries `continue-on-error: true`, which is documented to
# "allow a job to pass when this step fails", so each job's check run
# concludes `success`. Job-level `continue-on-error` is deliberately NOT used:
# it only keeps the workflow RUN green while the job's own check run is still
# reported as `failure` (the exact condition that produces `unstable`), and it
# additionally masks the real result behind `needs.<job>.result == 'success'`.
#
# Fail-closed behavior is preserved rather than weakened: each step is gated on
# the previous step's `outcome == 'success'`, so the first failure still stops
# the chain and no later step ever runs against a half-built state. Failures
# stay observable through a final `if: always()` step that emits a
# `::warning::` annotation and a job summary.
#
# Trust model (see docs/adr/009-readme-autoupdate.md, Issue #244):
#   Trusted   : origin/main, this workflow, trusted config, trusted notify script
#   Untrusted : PR branch, PR description, comments, source, README content,
#               issue content, OpenCode output, repository variables (ignored)
#
# Permissions default to nothing; each job grants the minimum it needs. The
# GITHUB_TOKEN is referenced ONLY in the notify job (to post a comment), and
# never gives write access to repository contents.

"on":
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: readme-autoupdate-${{ github.event.pull_request.number }}
  # A run captures one immutable PR_HEAD_SHA. Cancel an older run when the PR
  # advances so it cannot publish a stale candidate notification afterward.
  cancel-in-progress: true

jobs:
  update-readme:
    name: Model (Big Pickle) analysis
    # Fork PRs are skipped entirely: their GITHUB_TOKEN is read-only and
    # running untrusted fork code with any write path is never acceptable.
    # See docs/development/readme-autoupdate.md.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      action: ${{ steps.preflight.outputs.action }}
      bootstrap: ${{ steps.extract.outputs.bootstrap }}
      # Because every step is continue-on-error (Issue #268), this job now
      # completes successfully even when the model or the output gate failed.
      # Export whether a validated candidate was actually published so the
      # token-backed notify job stays gated exactly as it was when a failing
      # step aborted the whole job.
      candidate: ${{ steps.upload.outcome }}

    steps:
      - name: Checkout PR head
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Security boundary: the script, SSOT config, opencode config, and prompt
      # come from origin/main (the trusted ref), never from the PR head. A PR
      # therefore cannot relax its own enforcement.
      #
      # Bootstrap exception (analyze-only): the FIRST PR that introduces these
      # files has no trusted copy on origin/main yet, so it sources them from
      # the PR head (emits ::warning::BOOTSTRAP). Normal PR review gates that
      # single bootstrap, and the notify job refuses to run in bootstrap
      # mode - no GITHUB_TOKEN-backed comment is ever produced by it.
      - name: Extract trusted assets from origin/main
        id: extract
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/readme-sync"
          TRUSTED="$ROOT/trusted"
          mkdir -p "$TRUSTED"
          ASSETS=(
            scripts/ci/readme-sync.sh
            config/readme-autoupdate.json
            config/readme-autoupdate/opencode.json
            config/readme-autoupdate/prompt.md
          )
          if git cat-file -e origin/main:scripts/ci/readme-sync.sh 2>/dev/null; then
            git archive origin/main "${ASSETS[@]}" | tar -x -C "$TRUSTED"
            echo "bootstrap=0" >> "$GITHUB_OUTPUT"
            echo "trusted assets extracted from origin/main"
          else
            echo "::warning::BOOTSTRAP ANALYZE-ONLY: trusted assets not yet on origin/main; model runs from the PR-head copy, notify is skipped this run."
            tar -C . -cf - "${ASSETS[@]}" | tar -x -C "$TRUSTED"
            echo "bootstrap=1" >> "$GITHUB_OUTPUT"
          fi
          chmod +x "$TRUSTED/scripts/ci/readme-sync.sh"

      # Mechanical model/version pin (fail-closed). Reads the SSOT config that
      # was just extracted from origin/main (or PR head in the single, gated
      # bootstrap run) and fails unless the model is exactly opencode/big-pickle
      # and the version is a well-formed pinned value. No repository variable is
      # consulted and there is no fallback default.
      - name: Verify Big Pickle pin and pinned OpenCode version
        id: verify
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/readme-sync/trusted/scripts/ci/readme-sync.sh" verify-config
        env:
          README_SYNC_CONFIG: ${{ runner.temp }}/readme-sync/trusted/config/readme-autoupdate.json
          OPENCODE_CONFIG: ${{ runner.temp }}/readme-sync/trusted/config/readme-autoupdate/opencode.json

      - name: Preflight
        id: preflight
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/readme-sync/trusted/scripts/ci/readme-sync.sh" preflight
        env:
          README_SYNC_CONFIG: ${{ runner.temp }}/readme-sync/trusted/config/readme-autoupdate.json
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Install OpenCode (${{ steps.verify.outputs.version }} from trusted SSOT config)
        id: install
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.action == 'proceed'
        continue-on-error: true
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "${{ steps.verify.outputs.version }}" --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # The model is passed as a literal constant, never read from a variable or
      # repository variable; the verify-config gate above already failed the job
      # unless the trusted config also pins opencode/big-pickle. No fallback: an
      # unavailable model fails this step explicitly.
      - name: Run OpenCode on the PR changes
        id: model
        if: steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "PR: #$PR_NUMBER $PR_TITLE" > "$RUNNER_TEMP/readme-sync-prompt.md"
          {
            printf 'PR_BASE_SHA=%s\nPR_HEAD_SHA=%s\nPR_BASE_BRANCH=%s\nPR_HEAD_BRANCH=%s\n' \
              "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_BASE_BRANCH" "$PR_HEAD_BRANCH"
            printf 'REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
            printf 'PR_DESCRIPTION:\n'
            printf '%s\n' "$PR_BODY" | sed 's/^/  /' | head -200
          } >> "$RUNNER_TEMP/readme-sync-prompt.md"
          cat "$RUNNER_TEMP/readme-sync/trusted/config/readme-autoupdate/prompt.md" >> "$RUNNER_TEMP/readme-sync-prompt.md"
          opencode run \
            --print-logs \
            --pure \
            --auto \
            --model opencode/big-pickle \
            "$(cat "$RUNNER_TEMP/readme-sync-prompt.md")"
        # No GITHUB_TOKEN here. The model never receives repository credentials;
        # the only credentialed step is the separate notify job. Big Pickle is
        # used for free via OpenCode Zen with no API key.
        env:
          OPENCODE_CONFIG: ${{ runner.temp }}/readme-sync/trusted/config/readme-autoupdate/opencode.json
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

      # Mechanical output gate: after the model runs, this job asserts that the
      # working tree contains ONLY a (possibly unchanged) README.md modification
      # and exports exactly that file. Anything else makes the job fail, so the
      # notify job never even sees a candidate. The trusted notify script and
      # config used by the notify job are re-extracted from origin/main there.
      - name: Validate model output and export candidate README
        id: validate
        if: steps.model.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          [[ -f README.md ]] || { echo "::error::candidate README.md is missing (model deleted it); not publishing anything."; exit 1; }
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            path="${line:3}"
            if [[ "$path" == *" -> "* ]]; then
              path="${path##* -> }"
            fi
            [[ "$path" == "README.md" ]] || { echo "::error::model modified unexpected path '$path'; not publishing anything."; exit 1; }
          done < <(git status --porcelain=v1 --untracked-files=all)
          mkdir -p "$RUNNER_TEMP/readme-candidate"
          cp README.md "$RUNNER_TEMP/readme-candidate/README.md"
          echo "candidate README exported (unchanged or updated)"

      - name: Upload candidate README artifact
        id: upload
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: readme-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-candidate/README.md
          if-no-files-found: error
          retention-days: 1

      # Advisory reporting (Issue #268). Every step above is continue-on-error,
      # so this job's check run always concludes `success` and can never turn
      # the PR into mergeable_state=unstable. A real failure is not swallowed:
      # it is surfaced here as a workflow warning annotation and a job summary.
      - name: Summarize advisory outcome
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            checkout=${{ steps.checkout.outcome }}
            extract=${{ steps.extract.outcome }}
            verify=${{ steps.verify.outcome }}
            preflight=${{ steps.preflight.outcome }}
            install=${{ steps.install.outcome }}
            model=${{ steps.model.outcome }}
            validate=${{ steps.validate.outcome }}
            upload=${{ steps.upload.outcome }}
        run: |
          set -uo pipefail
          printf '%s\n' "$STEP_OUTCOMES"
          {
            echo "### README Auto-Update - model job (advisory; never gates the PR)"
            echo
            echo '```'
            printf '%s\n' "$STEP_OUTCOMES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$STEP_OUTCOMES" in
            *=failure*)
              echo "::warning::README Auto-Update model job had a failing step. README maintenance is advisory automation and deliberately reports success so it cannot make this pull request unstable (Issue #268). Inspect this job's log to diagnose."
              ;;
          esac
          exit 0

  notify-readme:
    name: Notify (clean job, origin/main assets, token-backed comment)
    needs: update-readme
    # Fork PRs never receive a README candidate comment; this job also never
    # runs in bootstrap mode below. The bootstrap check references the MODEL
    # job's output, so a race where origin/main gains the trusted assets between
    # the two jobs cannot turn an analyze-only bootstrap run into a
    # token-backed comment post.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.update-readme.outputs.action == 'proceed' &&
      needs.update-readme.outputs.bootstrap == '0' &&
      needs.update-readme.outputs.candidate == 'success'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A clean checkout on this runner. This workspace is NEVER shared with the
      # model job; the only cross-job input is the README-only artifact.
      - name: Checkout PR head
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Fresh extraction in THIS job from origin/main ONLY - never the PR head.
      # Even if OpenCode modified the model job's trusted directory, it cannot
      # influence this job. If origin/main lacks the assets (bootstrap), the
      # token-backed notify path is skipped entirely (analyze-only) instead of
      # executing PR-controlled code with GITHUB_TOKEN.
      - name: Extract trusted assets from origin/main
        id: extract
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/readme-sync"
          TRUSTED="$ROOT/trusted"
          mkdir -p "$TRUSTED"
          ASSETS=(
            scripts/ci/readme-sync.sh
            config/readme-autoupdate.json
            config/readme-autoupdate/opencode.json
            config/readme-autoupdate/prompt.md
          )
          if git cat-file -e origin/main:scripts/ci/readme-sync.sh 2>/dev/null; then
            git archive origin/main "${ASSETS[@]}" | tar -x -C "$TRUSTED"
            echo "bootstrap=0" >> "$GITHUB_OUTPUT"
            echo "trusted assets extracted from origin/main"
          else
            echo "::warning::BOOTSTRAP ANALYZE-ONLY: no trusted assets on origin/main; refusing to run PR-controlled code with the notify token. Notify steps skipped."
            echo "bootstrap=1" >> "$GITHUB_OUTPUT"
          fi
          chmod +x "$TRUSTED/scripts/ci/readme-sync.sh" 2>/dev/null || true

      - name: Download candidate README artifact
        id: download
        if: steps.extract.outcome == 'success' && steps.extract.outputs.bootstrap == '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: readme-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-artifact

      # Mechanical artifact inspection: exactly one root-level README.md file is
      # allowed. Extra paths, subdirectories, and symlinks fail closed.
      - name: Validate artifact (README.md only)
        id: validate
        if: steps.download.outcome == 'success' && steps.extract.outputs.bootstrap == '0'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/readme-artifact" <<'PY'
          import os
          import sys
          root = sys.argv[1]
          if not os.path.isdir(root):
              sys.exit("artifact directory missing: " + root)
          readmes = 0
          for dirpath, dirnames, filenames in os.walk(root):
              for d in dirnames:
                  full = os.path.join(dirpath, d)
                  if os.path.islink(full):
                      sys.exit("symlinked directory in artifact: " + d)
                  sys.exit("unexpected directory in artifact: " + os.path.relpath(full, root))
              for f in filenames:
                  full = os.path.join(dirpath, f)
                  if os.path.islink(full):
                      sys.exit("symlink in artifact: " + f)
                  rel = os.path.relpath(full, root)
                  if rel != "README.md":
                      sys.exit("unexpected artifact entry: " + rel)
                  readmes += 1
          if readmes == 0:
              sys.exit("artifact contains no README.md")
          print("artifact OK: exactly one README.md")
          PY

      # Runs the trusted origin/main notify script (freshly extracted in this
      # job). It compares the candidate README against the checked-out PR head
      # README; when identical it emits no comment (no noise). When they differ,
      # it posts a single, idempotent, advisory PR comment (marker + head SHA)
      # referencing the candidate artifact and the apply/decline instructions.
      # The bot NEVER pushes a commit to the PR head branch (Issue #244): a
      # github-actions[bot]-authored HEAD leaves required CI in action_required
      # with 0 jobs, permanently blocking the merge gate. Posting a comment does
      # not push a commit, so it does not re-trigger pull_request workflows or
      # leave a CI-capable state broken.
      #
      # Transitional guard: this workflow (executed from the PR merge ref) may
      # reference a "notify" command that the trusted origin/main script does not
      # yet implement in the same commit. In that case the token-backed notify
      # path must NOT fail the job; it is skipped with an explicit warning
      # (analyze-only) until origin/main ships the new script. This mirrors the
      # bootstrap philosophy: never run a token-backed action against a trusted
      # asset that is not yet ready.
      - name: Notify README candidate
        id: notify
        if: steps.validate.outcome == 'success' && steps.extract.outputs.bootstrap == '0'
        continue-on-error: true
        run: |
          set -euo pipefail
          NOTIFY_SCRIPT="$RUNNER_TEMP/readme-sync/trusted/scripts/ci/readme-sync.sh"
          if grep -qE '^[[:space:]]*notify\)' "$NOTIFY_SCRIPT"; then
            "$NOTIFY_SCRIPT" notify
          else
            echo "::warning::README notify command not yet present in the trusted origin/main script; skipping candidate comment (transitional PR)."
          fi
        env:
          README_SYNC_CONFIG: ${{ runner.temp }}/readme-sync/trusted/config/readme-autoupdate.json
          README_SYNC_BOOTSTRAP: "0"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_README: ${{ runner.temp }}/readme-artifact/README.md
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      # Advisory reporting (Issue #268), mirroring the model job. A failed
      # candidate notification is README maintenance, not a merge gate, so this
      # job's check run always concludes `success` while the real outcome is
      # surfaced as a warning annotation and a job summary.
      - name: Summarize advisory outcome
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            checkout=${{ steps.checkout.outcome }}
            extract=${{ steps.extract.outcome }}
            download=${{ steps.download.outcome }}
            validate=${{ steps.validate.outcome }}
            notify=${{ steps.notify.outcome }}
        run: |
          set -uo pipefail
          printf '%s\n' "$STEP_OUTCOMES"
          {
            echo "### README Auto-Update - notify job (advisory; never gates the PR)"
            echo
            echo '```'
            printf '%s\n' "$STEP_OUTCOMES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$STEP_OUTCOMES" in
            *=failure*)
              echo "::warning::README Auto-Update notify job had a failing step. The candidate comment is advisory automation and deliberately reports success so it cannot make this pull request unstable (Issue #268). Inspect this job's log to diagnose."
              ;;
          esac
          exit 0
