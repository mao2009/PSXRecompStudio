    operands:
      - name: rs
        type: register
        bits: [25, 21]
        role: source
      - name: offset
        type: immediate
        bits: [15, 0]
        sign_extend: true
        scale: 4
        role: source
    semantics: |
      target = PC + 4 + (sign_extend(offset) << 2)
      if GPR[rs] < 0 then  # signed
        branch_taken = true
        branch_target = target
    delay_slot: true
    delay_slot_type: conditional
    exceptions: []
    psx_notes: "符号付き0未満分岐。REGIMM encoding (rt=0x00)。"

  - name: BGEZ
    mnemonic: "bgez"
    opcode: 0x01
    format: REGIMM
    category: branch
    operands:
      - name: rs
        type: register
        bits: [25, 21]
        role: source
      - name: offset
        type: immediate
        bits: [15, 0]
        sign_extend: true
        scale: 4
        role: source
    semantics: |
      target = PC + 4 + (sign_extend(offset) << 2)
      if GPR[rs] >= 0 then  # signed
        branch_taken = true
        branch_target = target
    delay_slot: true
    delay_slot_type: conditional
    exceptions: []
    psx_notes: "符号付き0以上分岐。REGIMM encoding (rt=0x01)。"

  - name: BLTZAL
    mnemonic: "bltzal"
    opcode: 0x01
    format: REGIMM
    category: branch
    operands:
      - name: rs
        type: register
        bits: [25, 21]
        role: source
      - name: offset
        type: immediate
        bits: [15, 0]
        sign_extend: true
        scale: 4
        role: source
    semantics: |
      target = PC + 4 + (sign_extend(offset) << 2)
      GPR[31] = PC + 8  # return address
      if GPR[rs] < 0 then  # signed
        branch_taken = true
        branch_target = target
    delay_slot: true
    delay_slot_type: conditional
    exceptions: []
    psx_notes: "符号付き0未満分岐＆リンク。ra=$31にリターンアドレス。REGIMM (rt=0x10)。"

  - name: BGEZAL
    mnemonic: "bgezal"
    opcode: 0x01
    format: REGIMM
    category: branch
    operands:
      - name: rs
        type: register
        bits: [25, 21]
        role: source
      - name: offset
        type: immediate
        bits: [15, 0]
        sign_extend: true
        scale: 4
        role: source
    semantics: |
      target = PC + 4 + (sign_extend(offset) << 2)
      GPR[31] = PC + 8  # return address
      if GPR[rs] >= 0 then  # signed
        branch_taken = true
        branch_target = target
    delay_slot: true
    delay_slot_type: conditional
    exceptions: []
    psx_notes: "符号付き0以上分岐＆リンク。ra=$31にリターンアドレス。REGIMM (rt=0x11)。"

  # =========================================================================
  # Special Instructions
  # =========================================================================

  - name: SYSCALL
    mnemonic: "syscall"
    opcode: 0x00
    funct: 0x0C
    format: R
    category: special
    operands: []
    semantics: |
      trap(SyscallException)
    delay_slot: false
    exceptions:
      - Sys
    psx_notes: "システムコール。例外ベクトルにジャンプ。"

  - name: BREAK
    mnemonic: "break"
    opcode: 0x00
    funct: 0x0D
    format: R
    category: special
    operands: []
    semantics: |
      trap(BreakpointException)
    delay_slot: false
    exceptions:
      - Bp
    psx_notes: "ブレークポイント。20ビット即値は例外ハンドラで取得可能。"

  # =========================================================================
  # Coprocessor Instructions (COP0)
  # =========================================================================

  - name: MFC0
    mnemonic: "mfc0"
    opcode: 0x10
    rs: 0x00
    format: COP
    category: coprocessor
    operands:
      - name: rt
        type: register
        bits: [20, 16]
        role: destination
      - name: rd
        type: register
        bits: [15, 11]
        role: source
    semantics: |
      GPR[rt] = COP0[rd]
    delay_slot: false
    exceptions:
      - CpU
    psx_notes: "COP0レジスタからCPUレジスタへ転送。"

  - name: MTC0
    mnemonic: "mtc0"
    opcode: 0x10
    rs: 0x04
    format: COP
    category: coprocessor
    operands:
      - name: rt
        type: register
        bits: [20, 16]
        role: source
      - name: rd
        type: register
        bits: [15, 11]
        role: destination
    semantics: |
      COP0[rd] = GPR[rt]
    delay_slot: false
    exceptions:
      - CpU
    psx_notes: "CPUレジスタからCOP0レジスタへ転送。"

  - name: RFE
    mnemonic: "rfe"
    opcode: 0x10
    rs: 0x10
    format: COP
    category: coprocessor
    operands: []
    semantics: |
      # Return From Exception
      SR[7:0] = SR[9:2]     # Current mode ← Previous mode
      SR[9:8] = SR[11:10]   # IP ← next level
      PC = EPC
    delay_slot: false
    exceptions: []
    psx_notes: "例外から復帰。SRを復元し、EPCからPCを復元。"
